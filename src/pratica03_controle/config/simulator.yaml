kinematic_sim:
  ros__parameters:
    rate: 100.0
    frame_id: odom
    base_frame_id: chassis
    initial: {x: 0.0, y: 0.0, yaw: 0.0}
    max_linear_speed: 0.8
    max_angular_speed: 2.0
    command_timeout: 0.5
    # 1.0: modelo ideal. Para comparar rejeição a erro de atuação, por exemplo:
    # linear_scale: 0.95 / angular_scale: 1.05, iguais nos três ensaios.
    linear_scale: 1.0
    angular_scale: 1.0
