ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.3
    two_d_mode: true
    print_diagnostics: true
    publish_tf: true
    reset_on_time_jump: true
    map_frame: map
    odom_frame: odom
    base_link_frame: chassis
    world_frame: odom

    # Ordem: x y z roll pitch yaw vx vy vz vroll vpitch vyaw ax ay az.
    # Somente X/Y do GPS; o yaw desta mensagem vem da mesma IMU abaixo.
    odom0: /localization/odom
    odom0_config: [true, true, false,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # Orientacao absoluta e velocidade angular; aceleracao nao entra no filtro.
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 20
    imu0_differential: false
    imu0_relative: false
