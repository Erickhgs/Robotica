controller_manager:
  ros__parameters:

    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController


diff_drive_controller:
  ros__parameters:

    left_wheel_names:
      - right_wheel_hinge

    right_wheel_names:
      - left_wheel_hinge


    wheel_separation: 0.26

    
    wheel_radius: 0.10

    wheels_per_side: 1

    
    use_stamped_vel: false

   
    open_loop: false
    position_feedback: true

    odom_frame_id: odom
    base_frame_id: chassis

    enable_odom_tf: true

    publish_rate: 50.0

    cmd_vel_timeout: 0.5

    publish_limited_velocity: true


    # LIMITES LINEARES

    linear.x.has_velocity_limits: true
    linear.x.max_velocity: 0.8
    linear.x.min_velocity: -0.8

    linear.x.has_acceleration_limits: true
    linear.x.max_acceleration: 1.5
    linear.x.min_acceleration: -1.5


    # LIMITES ANGULARES

    angular.z.has_velocity_limits: true
    angular.z.max_velocity: 2.0
    angular.z.min_velocity: -2.0

    angular.z.has_acceleration_limits: true
    angular.z.max_acceleration: 3.0
    angular.z.min_acceleration: -3.0